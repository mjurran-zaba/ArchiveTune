name: Build Pull Request

# [VoidTune Patch: Enable CI Trigger on VoidTune Branch Push & Manual Dispatch]
# REASON: Enable instant cloud build of debug APKs upon pushing to VoidTune branch without requiring a release keystore.
# ORIGINAL CODE:
# on:
#   pull_request:
#     branches:
#       - "**"
on:
  workflow_dispatch:
  push:
    branches:
      - "VoidTune"
  pull_request:
    branches:
      - "**"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.15'

      - name: Generate translation contributor credits
        run: python scripts/generate_translation_contributors.py

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: 27
          distribution: "temurin"

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
          cache-cleanup: on-success

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Generate debug.keystore if not exists
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkey -v \
              -keystore ~/.android/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build and Lint Mobile Universal Debug APK
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --console=plain assembleGmsMobileUniversalDebug :app:lintGmsMobileUniversalDebug --warning-mode summary 2>&1 | python3 -c "import re,sys;p=re.compile(r'^(WARNING: )?\[CXX5202\] This app only has 32-bit \[(armeabi-v7a|x86)\] native libraries\. Beginning August 1, 2019 Google Play store requires that all apps that include native libraries must provide 64-bit versions\. For more information, visit https://g\.co/64-bit-requirement\$');[sys.stdout.write(l) for l in sys.stdin if not p.match(l.rstrip())]"
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          PULL_REQUEST: "true"
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          API_BEARER_TOKEN: ${{ secrets.API_BEARER_TOKEN }}
          CANVAS_BEARER_TOKEN: ${{ secrets.CANVAS_BEARER_TOKEN }}
          EXTRACTOR_BEARER: ${{ secrets.EXTRACTOR_BEARER }}

      # [VoidTune Patch: Upload Built Debug APK Artifact]
      # REASON: Preserve the generated APK as a downloadable GitHub Actions artifact for immediate testing.
      - name: Upload VoidTune Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: VoidTune-Universal-Debug
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: warn

      # [VoidTune Patch: Automated Telegram Build Status Notification]
      # REASON: Send real-time notification to user Telegram on build completion (both SUCCESS and FAILURE)
      # with run summary, commit message, and direct link to download the compiled APK.
      - name: Send Telegram Notification
        if: always()
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BUILD_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          COMMIT_HASH: ${{ github.sha }}
        run: |
          python3 -c "
          import os, urllib.request, json
          bot_token = os.environ.get('BOT_TOKEN')
          chat_id = os.environ.get('CHAT_ID')
          if not bot_token or not chat_id:
              print('Telegram secrets missing, skipping notification.')
              exit(0)

          status = os.environ.get('BUILD_STATUS', 'UNKNOWN').upper()
          run_url = os.environ.get('RUN_URL', '')
          commit_hash = os.environ.get('COMMIT_HASH', '')[:7]
          commit_msg = (os.environ.get('COMMIT_MSG', '').splitlines() or [''])[0]

          if status == 'SUCCESS':
              text = (
                  f'🚀 <b>VoidTune CI: Build SUKSES!</b>\n\n'
                  f'📌 <b>Commit:</b> <code>{commit_hash}</code>\n'
                  f'💬 <b>Pesan:</b> {commit_msg}\n'
                  f'📦 <b>Status:</b> Berhasil dikompilasi! APK Universal Debug siap diunduh di artefak GitHub Actions.\n\n'
                  f'🔗 <a href=\"{run_url}\">Cek Hasil Build & Download APK</a>'
              )
          else:
              text = (
                  f'❌ <b>VoidTune CI: Build GAGAL (FAILED)!</b>\n\n'
                  f'📌 <b>Commit:</b> <code>{commit_hash}</code>\n'
                  f'💬 <b>Pesan:</b> {commit_msg}\n'
                  f'⚠️ <b>What went wrong:</b> Kompilasi atau linting Gradle gagal.\n\n'
                  f'🔗 <a href=\"{run_url}\">Cek Log Error di GitHub Actions</a>'
              )

          url = f'https://api.telegram.org/bot{bot_token}/sendMessage'
          payload = json.dumps({
              'chat_id': chat_id,
              'text': text,
              'parse_mode': 'HTML',
              'disable_web_page_preview': False
          }).encode('utf-8')
          req = urllib.request.Request(url, data=payload, headers={'Content-Type': 'application/json'})
          try:
              with urllib.request.urlopen(req) as resp:
                  print('Telegram notification dispatched successfully.')
          except Exception as e:
              print('Telegram notification error:', e)
          "
