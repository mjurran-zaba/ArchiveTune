name: Auto-Sync Trending Music News

on:
  schedule:
    # Run once every 24 hours at 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install Scrapling & Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "scrapling[fetchers,rag]"

      - name: Scrape & Sync Music News
        run: |
          python tools/sync_music_news.py

      - name: Commit & Push to VoidTune and main Branches
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news/
          if git diff --staged --quiet; then
            echo "No new news changes detected."
          else
            git commit -m "chore(news): auto-sync trending music news via Scrapling"
            # Push to current branch
            git push origin HEAD
            # Also keep VoidTune branch synced
            git push origin HEAD:VoidTune || true
          fi
